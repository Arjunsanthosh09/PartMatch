<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product — PartMatch Vendor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
          --white:#ffffff;
          --bg-soft:#f4faf5;
          --ink:#0f1e17;
          --ink-soft:#4c5f56;
          --ink-faint:#8a9992;
          --green-900:#0d3b2c;
          --green-700:#146c43;
          --green-600:#178a4c;
          --green-500:#1fa85a;
          --green-100:#dcf5e3;
          --green-050:#eefbf1;
          --line:#d9e9dd;
          --line-strong:#b8d4c0;
          --amber:#e67e22;
          --red:#e74c3c;
          --glass-bg:rgba(255,255,255,0.5);
          --glass-bg-strong:rgba(255,255,255,0.72);
          --glass-border:rgba(255,255,255,0.8);
          --glass-shadow:0 8px 32px -8px rgba(13,59,44,0.2);
        }
        *{box-sizing:border-box; margin:0; padding:0;}
        html{scroll-behavior:smooth;}
        body{
          font-family:'Inter',sans-serif;
          color:var(--ink);
          min-height:100vh;
          position:relative;
          -webkit-font-smoothing:antialiased;
        }
        h1,h2,h3{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em;}
        .mono{font-family:'IBM Plex Mono',monospace;}
        .wrap{max-width:800px; margin:0 auto; padding:0 32px;}
        a{color:inherit; text-decoration:none;}

        /* ============ AMBIENT BACKGROUND ============ */
        body::before{
          content:""; position:fixed; inset:0; z-index:-3;
          background:
            radial-gradient(ellipse 55% 45% at 6% -8%, rgba(34,197,94,0.30) 0%, transparent 62%),
            radial-gradient(ellipse 55% 50% at 102% -4%, rgba(45,212,191,0.26) 0%, transparent 58%),
            radial-gradient(ellipse 60% 55% at 50% 115%, rgba(251,191,36,0.16) 0%, transparent 60%),
            radial-gradient(ellipse 45% 40% at 85% 60%, rgba(34,197,94,0.14) 0%, transparent 60%),
            linear-gradient(180deg, #eefaf1 0%, #e2f4ea 45%, #edf8f0 100%);
        }
        body::after{
          content:""; position:fixed; inset:0; z-index:-2; opacity:.5; pointer-events:none;
          background-image:
            linear-gradient(var(--line) 1px, transparent 1px),
            linear-gradient(90deg, var(--line) 1px, transparent 1px);
          background-size:56px 56px;
          mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 85%);
        }
        .grain{
          position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5; mix-blend-mode:overlay;
          background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
        }
        .blob{position:fixed; z-index:-1; border-radius:50%; filter:blur(64px); opacity:.75; pointer-events:none; animation:blobFloat 14s ease-in-out infinite;}
        .blob-a{width:460px; height:460px; background:radial-gradient(circle,#7fe0a3,transparent 70%); top:-140px; right:-100px; animation-delay:0s;}
        .blob-b{width:380px; height:380px; background:radial-gradient(circle,#6fe3d6,transparent 70%); bottom:6%; left:-120px; animation-delay:3s;}
        .blob-c{width:300px; height:300px; background:radial-gradient(circle,#f6d38a,transparent 70%); bottom:-70px; right:22%; animation-delay:6s;}
        .blob-d{width:260px; height:260px; background:radial-gradient(circle,#9beac0,transparent 70%); top:30%; right:8%; animation-delay:2s;}
        @keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(24px,-22px) scale(1.06);}}

        /* ============ ENTRANCE ANIMATION ============ */
        @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
        .anim{animation:fadeUp .6s cubic-bezier(.22,.61,.36,1) both;}
        .d1{animation-delay:.02s;} .d2{animation-delay:.08s;} .d3{animation-delay:.14s;}
        .d4{animation-delay:.2s;} .d5{animation-delay:.26s;} .d6{animation-delay:.32s;}
        @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

        /* ============ TOPBAR (glass) ============ */
        .topbar{
          position:sticky; top:0; z-index:100;
          background:var(--glass-bg-strong);
          backdrop-filter:blur(18px) saturate(1.7); -webkit-backdrop-filter:blur(18px) saturate(1.7);
          border-bottom:1px solid var(--glass-border);
          box-shadow:0 4px 24px -12px rgba(13,59,44,0.12);
        }
        .topbar-row{display:flex; align-items:center; gap:6px; padding:14px 0; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;}
        .topbar-row::-webkit-scrollbar{display:none;}
        .brandmark{display:flex; align-items:center; gap:10px; margin-right:18px; flex-shrink:0;}
        .brandmark svg{width:30px; height:30px;}
        .brandmark strong{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700;}
        .brandmark small{display:block; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:400;}

        .navlink{
          display:flex; align-items:center; gap:7px; padding:9px 14px; font-size:13.5px; font-weight:600;
          color:var(--ink-soft); border:1px solid transparent; border-radius:8px; white-space:nowrap;
          transition:all .25s ease; flex-shrink:0; position:relative;
        }
        .navlink svg{width:15px; height:15px; flex-shrink:0;}
        .navlink:hover{background:var(--green-050); color:var(--green-700); border-color:var(--line);}
        .navlink.active{background:var(--green-700); color:#fff; box-shadow:0 4px 14px -4px rgba(20,108,67,.5);}
        .nav-spacer{flex:1;}
        .navlink.logout{color:var(--red); margin-left:auto; flex-shrink:0;}
        .navlink.logout:hover{background:#fdecea; border-color:#f6c6c1;}

        /* ============ PAGE HEADER ============ */
        .page-head{padding:34px 0 6px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
        .eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--green-700); font-weight:500; padding:6px 12px; border:1px dashed var(--line-strong); background:var(--green-050);}
        .eyebrow::before{content:""; width:6px; height:6px; background:var(--green-500); border-radius:50%; box-shadow:0 0 0 3px var(--green-100); animation:pulseDot 1.8s ease-in-out infinite;}
        @keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:.35;}}
        .page-head h1{font-size:28px; margin-top:10px;}
        .page-head p{color:var(--ink-soft); margin-top:6px; font-size:14.5px;}
        .head-right{display:flex; align-items:center; gap:16px;}
        .head-illustration{width:220px; height:108px; padding:6px 10px; border-radius:14px; overflow:hidden;}
        .head-illustration svg{width:100%; height:100%; display:block;}
        .glowdot{animation:glowPulse 2.4s ease-in-out infinite;}
        .glowdot:nth-of-type(2){animation-delay:.3s;}
        .glowdot:nth-of-type(3){animation-delay:.8s;}
        @keyframes glowPulse{0%,100%{opacity:1; r:4;} 50%{opacity:.4; r:5.5;}}
        @media (max-width:820px){ .head-illustration{display:none;} }

        /* ============ GLASS CARD BASE ============ */
        .glass{
          background:var(--glass-bg);
          backdrop-filter:blur(18px) saturate(1.7); -webkit-backdrop-filter:blur(18px) saturate(1.7);
          border:1px solid var(--glass-border);
          border-radius:16px;
          box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.8);
          transition:transform .3s cubic-bezier(.22,.61,.36,1), box-shadow .3s ease, border-color .3s ease;
          position:relative;
        }
        .glass:hover{transform:translateY(-3px); box-shadow:0 16px 40px -10px rgba(13,59,44,0.24), inset 0 1px 0 rgba(255,255,255,0.85); border-color:rgba(23,138,76,0.35);}

        /* ============ FORM STYLES ============ */
        .form-card{
          background:var(--glass-bg);
          backdrop-filter:blur(18px) saturate(1.7); -webkit-backdrop-filter:blur(18px) saturate(1.7);
          border:1px solid var(--glass-border);
          border-radius:16px;
          box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.8);
          padding:32px;
          margin-bottom:40px;
        }
        .field{margin-bottom:20px;}
        .field label{display:block; font-size:13px; font-weight:600; margin-bottom:8px; color:var(--ink); letter-spacing:-0.01em;}
        .field input,.field select,.field textarea{
          width:100%; padding:11px 14px; border:1.5px solid var(--line-strong); border-radius:10px;
          font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
          background:rgba(255,255,255,0.6); transition:all .2s ease;
        }
        .field input:focus,.field select:focus,.field textarea:focus{
          outline:none; border-color:var(--green-600); background:#fff;
          box-shadow:0 0 0 3px rgba(31,168,90,0.1);
        }
        .field input::placeholder,.field textarea::placeholder{color:var(--ink-faint);}
        .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
        .field textarea{resize:vertical; min-height:80px;}

        .btn{
          font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:none;
          padding:12px 24px; border-radius:10px; display:inline-flex; align-items:center; gap:8px;
          transition:all .25s ease; text-decoration:none;
        }
        .btn-solid{
          background:var(--green-700); color:#fff;
          box-shadow:0 4px 14px -4px rgba(20,108,67,.5); width:100%; justify-content:center;
        }
        .btn-solid:hover{background:var(--green-900); transform:translateY(-1px); box-shadow:0 6px 20px -4px rgba(20,108,67,.6);}
        .btn-ghost{background:rgba(255,255,255,0.5); color:var(--ink); border:1px solid var(--line-strong);}
        .btn-ghost:hover{background:#fff; border-color:var(--green-600); color:var(--green-700); transform:translateY(-1px);}
        .btn-sm{padding:8px 14px; font-size:12.5px;}
        .btn svg{width:15px; height:15px;}

        .required{color:var(--red); font-weight:700;}

        @media (max-width:560px){
            .wrap{padding:0 20px;}
            .field-row{grid-template-columns:1fr;}
            .form-card{padding:24px;}
        }
    </style>
</head>
<body>

<!-- decorative ambient blobs (glassmorphism backdrop) -->
<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<div class="blob blob-c"></div>
<div class="blob blob-d"></div>
<div class="grain"></div>

<!-- ============ TOPBAR ============ -->
<div class="topbar anim">
    <div class="wrap topbar-row" style="max-width:1280px;">
        <div class="brandmark">
            <svg viewBox="0 0 40 40" fill="none">
                <rect x="1" y="1" width="38" height="38" stroke="#178a4c" stroke-width="1.4" stroke-dasharray="3 3"/>
                <path d="M9 24l2-7c.4-1.2 1.5-2 2.8-2h12.4c1.3 0 2.4.8 2.8 2l2 7" stroke="#0d3b2c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 24h22v3.5a1.5 1.5 0 01-1.5 1.5h-1a1.5 1.5 0 01-1.5-1.5V26h-15v1.5A1.5 1.5 0 0110.5 29h-1A1.5 1.5 0 018 27.5V24z" stroke="#0d3b2c" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="14" cy="24" r="1.6" fill="#178a4c"/>
                <circle cx="26" cy="24" r="1.6" fill="#178a4c"/>
            </svg>
            <span><strong>PartMatch</strong><small>Vendor Console</small></span>
        </div>

        <a href="{{ url_for('vendor_dashboard') }}" class="navlink">
            <svg viewBox="0 0 20 20" fill="none"><path d="M3 10l7-6 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9v7a1 1 0 001 1h8a1 1 0 001-1V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Dashboard
        </a>
        <a href="{{ url_for('vendor_add_product') }}" class="navlink">
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Add Product
        </a>
        <a href="{{ url_for('vendor_manage_inventory') }}" class="navlink active">
            <svg viewBox="0 0 20 20" fill="none"><path d="M3 6.5l7-3.5 7 3.5-7 3.5-7-3.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 6.5V14l7 3.5 7-3.5V6.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 10v7.5" stroke="currentColor" stroke-width="1.5"/></svg>
            Inventory
        </a>
        <a href="{{ url_for('vendor_orders') }}" class="navlink">
            <svg viewBox="0 0 20 20" fill="none"><path d="M3 6v10a1 1 0 001 1h12a1 1 0 001-1V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6l7-3 7 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 3v14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Orders
        </a>
        <a href="{{ url_for('vendor_profile') }}" class="navlink">
          <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
            <circle
              cx="10"
              cy="7"
              r="3.5"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="M3 18c1.5-4 4-6 7-6s5.5 2 7 6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          Profile
        </a>
        <div class="nav-spacer"></div>
        <a href="{{ url_for('logout') }}" class="navlink logout">
            <svg viewBox="0 0 20 20" fill="none"><path d="M8 17H4.5A1.5 1.5 0 013 15.5v-11A1.5 1.5 0 014.5 3H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 13.5L17 10l-4-3.5M17 10H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Logout
        </a>
    </div>
</div>

<div class="wrap">

    <!-- ============ PAGE HEADER ============ -->
    <div class="page-head anim d1">
        <div>
            <span class="eyebrow">Edit Product</span>
            <h1>Edit Product</h1>
            <p>Update your product details below.</p>
        </div>
        <div class="head-right">
            <a href="{{ url_for('vendor_manage_inventory') }}" class="btn btn-ghost">
                <svg viewBox="0 0 20 20" fill="none" style="width:15px;height:15px;"><path d="M15 10H5M5 10l4-4M5 10l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Back to Inventory
            </a>
        </div>
    </div>

    <!-- ============ FORM ============ -->
    <div class="form-card anim d2">
        <form method="POST">
            <div class="field">
                <label>Product Name <span class="required">*</span></label>
                <input type="text" name="name" value="{{ product.name }}" required>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Category</label>
                    <select name="category_id">
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label>Brand</label>
                    <input type="text" name="brand" value="{{ product.brand or '' }}">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Part Number</label>
                    <input type="text" name="part_number" value="{{ product.part_number or '' }}">
                </div>
                <div class="field">
                    <label>Price (₹) <span class="required">*</span></label>
                    <input type="number" name="price" step="0.01" value="{{ product.price }}" required>
                </div>
            </div>
            <div class="field">
                <label>Stock Quantity <span class="required">*</span></label>
                <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" min="0" required>
            </div>
            <div class="field">
                <label>Description</label>
                <textarea name="description" rows="3">{{ product.description or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-solid">
                <svg viewBox="0 0 20 20" fill="none" style="width:16px;height:16px;"><path d="M4 10.5l4 4 8-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Update Product
            </button>
        </form>
    </div>
</div>

</body>
</html>
