<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product — Vendor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
          --white:#fff; --bg-soft:#f4faf5; --ink:#0f1e17; --ink-soft:#4c5f56;
          --ink-faint:#8a9992; --green-700:#146c43; --green-600:#178a4c;
          --green-500:#1fa85a; --green-050:#eefbf1; --line:#d9e9dd;
          --line-strong:#b8d4c0;
        }
        *{box-sizing:border-box; margin:0; padding:0;}
        body{font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg-soft);}
        .wrap{max-width:800px; margin:0 auto; padding:0 32px;}
        h1,h2{font-family:'Space Grotesk',sans-serif;}
        .btn{font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:none; padding:11px 20px; border-radius:2px; display:inline-flex; align-items:center; gap:8px; text-decoration:none;}
        .btn-solid{background:var(--green-700); color:#fff; width:100%; justify-content:center;}
        .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
        .btn-sm{padding:6px 14px; font-size:12px;}
        .form-card{background:#fff; border:1px solid var(--line); border-radius:4px; padding:32px;}
        .field{margin-bottom:16px;}
        .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink);}
        .field input,.field select,.field textarea{width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:2px; font-family:'Inter',sans-serif; font-size:14px; background:var(--bg-soft);}
        .field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--green-600); background:#fff;}
        .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
    </style>
</head>
<body>

<div style="background:#fff; border-bottom:1px solid var(--line); padding:12px 0; margin-bottom:30px;">
    <div class="wrap" style="display:flex; gap:12px; align-items:center;">
        <strong style="font-family:'Space Grotesk',sans-serif; font-size:18px;">🏪 PartMatch Vendor</strong>
        <a href="{{ url_for('vendor_manage_inventory') }}" class="btn btn-ghost btn-sm">← Back</a>
    </div>
</div>

<div class="wrap">
    <h2 style="margin-bottom:24px;">✏️ Edit Product</h2>

    <div class="form-card">
        <form method="POST">
            <div class="field">
                <label>Product Name *</label>
                <input type="text" name="name" value="{{ product.name }}" required>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Category</label>
                    <select name="category_id">
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label>Brand</label>
                    <input type="text" name="brand" value="{{ product.brand or '' }}">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Part Number</label>
                    <input type="text" name="part_number" value="{{ product.part_number or '' }}">
                </div>
                <div class="field">
                    <label>Price (₹) *</label>
                    <input type="number" name="price" step="0.01" value="{{ product.price }}" required>
                </div>
            </div>
            <div class="field">
                <label>Stock Quantity *</label>
                <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" min="0" required>
            </div>
            <div class="field">
                <label>Description</label>
                <textarea name="description" rows="3">{{ product.description or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-solid">💾 Update Product</button>
        </form>
    </div>
</div>

</body>
</html>
