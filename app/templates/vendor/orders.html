<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — Vendor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
          --white:#fff; --bg-soft:#f4faf5; --ink:#0f1e17; --ink-soft:#4c5f56;
          --ink-faint:#8a9992; --green-700:#146c43; --green-600:#178a4c;
          --green-500:#1fa85a; --green-050:#eefbf1; --line:#d9e9dd;
          --line-strong:#b8d4c0;
        }
        *{box-sizing:border-box; margin:0; padding:0;}
        body{font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg-soft);}
        .wrap{max-width:1240px; margin:0 auto; padding:0 32px;}
        h1,h2{font-family:'Space Grotesk',sans-serif;}
        table{width:100%; border-collapse:collapse; font-size:13px; background:#fff; border:1px solid var(--line);}
        table th{text-align:left; padding:12px; border-bottom:2px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--ink-faint); background:var(--green-050);}
        table td{padding:12px; border-bottom:1px solid var(--line);}
        .badge{display:inline-block; padding:3px 10px; border-radius:2px; font-size:11px; font-weight:600;}
        .badge-success{background:#d5f5e3; color:#27ae60;}
        .badge-warning{background:#fef9e7; color:#e67e22;}
        .badge-info{background:#dbeafe; color:#2980b9;}
        .badge-danger{background:#fadbd8; color:#e74c3c;}
        .btn{font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:none; padding:8px 16px; border-radius:2px; display:inline-flex; align-items:center; gap:6px; text-decoration:none;}
        .btn-solid{background:var(--green-700); color:#fff;}
        .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
        .btn-sm{padding:6px 14px; font-size:12px;}
        .eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--green-700); padding:6px 12px; border:1px dashed var(--line-strong); background:var(--green-050);}
        .eyebrow::before{content:""; width:6px; height:6px; background:var(--green-500); border-radius:50%;}
    </style>
</head>
<body>

<div style="background:#fff; border-bottom:1px solid var(--line); padding:12px 0; margin-bottom:30px;">
    <div class="wrap" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <strong style="font-family:'Space Grotesk',sans-serif; font-size:18px; margin-right:20px;">🏪 PartMatch Vendor</strong>
        <a href="{{ url_for('vendor_dashboard') }}" class="btn btn-ghost btn-sm">🏠 Dashboard</a>
        <a href="{{ url_for('vendor_add_product') }}" class="btn btn-ghost btn-sm">➕ Add Product</a>
        <a href="{{ url_for('vendor_manage_inventory') }}" class="btn btn-ghost btn-sm">📦 Inventory</a>
        <a href="{{ url_for('vendor_orders') }}" class="btn btn-ghost btn-sm">📋 Orders</a>
        <a href="{{ url_for('logout') }}" class="btn btn-solid btn-sm" style="margin-left:auto;">🚪 Logout</a>
    </div>
</div>

<div class="wrap">
    <div style="margin-bottom:24px;">
        <span class="eyebrow">Orders</span>
        <h2 style="font-size:28px; margin-top:8px;">Customer Orders</h2>
        <p style="color:var(--ink-soft); margin-top:6px;">Orders for your products will appear here.</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="7" style="text-align:center; padding:40px; color:var(--ink-faint);">
                📦 No orders received yet. Your products need to be approved by admin first.
            </td></tr>
        </tbody>
    </table>
</div>

</body>
</html>
