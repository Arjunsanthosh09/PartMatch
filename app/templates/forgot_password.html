<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — PartMatch</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box; margin:0; padding:0;}
        body{font-family:'Inter',sans-serif; background:#f4faf5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
        body::before{content:""; position:fixed; inset:0; z-index:-1;
          background: radial-gradient(ellipse 55% 45% at 6% -8%, rgba(34,197,94,0.30) 0%, transparent 62%),
            radial-gradient(ellipse 55% 50% at 102% -4%, rgba(45,212,191,0.26) 0%, transparent 58%);}
        .card{background:#fff; border-radius:16px; box-shadow:0 20px 60px -20px rgba(13,59,44,0.3); padding:40px; max-width:420px; width:100%;}
        h1{font-family:'Space Grotesk',sans-serif; font-size:24px; margin-bottom:10px; color:#0f1e17;}
        p.sub{font-size:13.5px; color:#4c5f56; margin-bottom:24px; line-height:1.5;}
        .field{margin-bottom:16px;}
        .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#0f1e17;}
        .field input{width:100%; padding:12px 14px; border:1.5px solid #b8d4c0; border-radius:10px; font-family:inherit; font-size:14px; background:#f9fdfa;}
        .field input:focus{outline:none; border-color:#178a4c; background:#fff;}
        .btn{width:100%; padding:13px; background:#146c43; color:#fff; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;}
        .btn:hover{background:#0d3b2c;}
        .back{display:block; text-align:center; margin-top:16px; font-size:13px; color:#178a4c; text-decoration:none;}
        .back:hover{text-decoration:underline;}
        .flash{padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px;}
        .flash.success{background:#d5f5e3; color:#1e8449;}
        .flash.danger{background:#fadbd8; color:#c0392b;}
    </style>
</head>
<body>
    <div class="card">
        <h1>Forgot Password?</h1>
        <p class="sub">Enter your email and we'll send a reset link.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="field">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn">Send Reset Link</button>
        </form>
        <a href="{{ url_for('home') }}" class="back">← Back to Login</a>
    </div>
</body>
</html>
