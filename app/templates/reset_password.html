<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password — PartMatch</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box; margin:0; padding:0;}
        body{font-family:'Inter',sans-serif; background:#f4faf5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
        body::before{content:""; position:fixed; inset:0; z-index:-1; background: radial-gradient(ellipse 55% 45% at 6% -8%, rgba(34,197,94,0.30) 0%, transparent 62%);}
        .card{background:#fff; border-radius:16px; box-shadow:0 20px 60px -20px rgba(13,59,44,0.3); padding:40px; max-width:420px; width:100%;}
        h1{font-family:'Space Grotesk',sans-serif; font-size:24px; margin-bottom:10px;}
        p.sub{font-size:13.5px; color:#4c5f56; margin-bottom:24px;}
        .field{margin-bottom:16px;}
        .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px;}
        .field input{width:100%; padding:12px 14px; border:1.5px solid #b8d4c0; border-radius:10px; font-family:inherit; font-size:14px; background:#f9fdfa;}
        .field input:focus{outline:none; border-color:#178a4c; background:#fff;}
        .btn{width:100%; padding:13px; background:#146c43; color:#fff; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;}
        .btn:hover{background:#0d3b2c;}
        .flash{padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px;}
        .flash.danger{background:#fadbd8; color:#c0392b;}
    </style>
</head>
<body>
    <div class="card">
        <h1>Set New Password</h1>
        <p class="sub">Choose a strong password.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="field">
                <label>New Password</label>
                <input type="password" name="password" placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Re-enter password" required>
            </div>
            <button type="submit" class="btn">Reset Password</button>
        </form>
    </div>
</body>
</html>
